<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lagu Lokal</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f7f5ef">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f7f5ef;--sf:#ffffff;--tx:#1b2433;--mu:#6b7488;--ln:#e3dfd2;--ac:#2563eb;--ac2:#1d4ed8}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--tx);font:16px/1.4 "Trebuchet MS",system-ui,sans-serif}
body{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:env(safe-area-inset-top);border-bottom:1px solid var(--ln)}
header .in{max-width:820px;margin:auto;padding:10px 16px}
h1{font-size:1.4rem;margin-bottom:8px}
.tabs{display:flex;justify-content:space-between;align-items:center;gap:8px}
nav{display:flex;gap:8px}
main{max-width:820px;margin:auto;padding:8px 16px 16px}
h2{font-size:1.05rem;margin:12px 0 6px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:#ebe7da;padding:10px 14px;border-radius:10px}
button:hover{background:#e0dbcb}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
nav button.on{background:var(--ac);color:#fff;font-weight:700}
.plus{width:44px;height:44px;border-radius:50%;background:var(--ac);color:#fff;font-size:1.8rem;line-height:1;padding:0}
.plus:hover,.pri:hover{background:var(--ac2)}
.pri{background:var(--ac);color:#fff;font-weight:700}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;margin:10px 0 14px}
.bar{display:flex;gap:8px;flex-wrap:wrap}
input[type=text]{flex:1;min-width:0;background:#fff;border:1px solid var(--ln);padding:10px 12px;border-radius:10px;width:100%}
.row{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--ln);background:var(--bg)}
.swrap{position:relative;overflow:hidden;border-bottom:1px solid var(--ln)}
.swrap .row{border-bottom:0}
.slide{position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.edit{position:absolute;left:0;top:0;bottom:0;width:72px;border-radius:0;background:var(--ac);color:#fff;display:grid;place-items:center;padding:0}
.edit:hover{background:var(--ac2)}
.row .t{flex:1;min-width:0;text-align:left;background:none;padding:12px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-left:3px solid transparent;border-radius:0}
.row.cur .t{border-color:var(--ac);color:var(--ac);font-weight:700}
.row .i{background:none;padding:10px;color:var(--mu)}
.row .i:hover{color:var(--tx)}
.empty{color:var(--mu);padding:20px 4px}
.pl{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;margin-bottom:8px;background:var(--sf);border:1px solid var(--ln)}
#player{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);box-shadow:0 -4px 14px #1b243314;padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
#player .in{max-width:820px;margin:auto}
#now{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;margin-bottom:4px}
.seek{display:flex;align-items:center;gap:8px;color:var(--mu);font-size:.8rem}
.seek input{flex:1;accent-color:var(--ac)}
.ctl{display:flex;justify-content:center;gap:10px;margin-top:6px}
.ctl button{min-width:48px;min-height:44px;font-size:1.15rem}
.ctl .main{background:var(--ac);color:#fff;border-radius:50%;width:52px;height:52px;padding:0}
.ctl .main:hover{background:var(--ac2)}
.ctl .on{background:var(--ac);color:#fff}
dialog{background:var(--sf);color:var(--tx);border:1px solid var(--ln);border-radius:14px;padding:18px;width:min(92vw,360px)}
dialog::backdrop{background:#0008}
dialog button{width:100%;margin-top:8px;text-align:left}
dialog input{margin-top:10px}
.two{display:flex;gap:8px}
.two button{flex:1;text-align:center}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(160px + env(safe-area-inset-bottom));background:var(--tx);color:#fff;padding:10px 16px;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
@media(max-width:480px){header .in,main{padding-left:12px;padding-right:12px}.ctl{gap:6px}}
</style>
</head>
<body>
<header>
  <div class="in">
    <h1>Lagu Lokal</h1>
    <div class="tabs">
      <nav>
        <button id="tLib" class="on">Pustaka</button>
        <button id="tPl">Playlist</button>
      </nav>
      <button id="add" class="plus" title="Tambah lagu dari perangkat" aria-label="Tambah lagu dari perangkat">+</button>
    </div>
  </div>
</header>
<main><section id="view"></section></main>

<div id="player">
  <div class="in">
    <div id="now">Belum ada lagu yang diputar</div>
    <div class="seek"><span id="cur">0:00</span><input id="sk" type="range" min="0" max="100" value="0" step="0.1" aria-label="Posisi lagu"><span id="dur">0:00</span></div>
    <div class="ctl">
      <button id="bLoop" title="Ulangi satu lagu: mati" aria-label="Ulangi satu lagu">⟲</button>
      <button id="bPrev" title="Lagu sebelumnya" aria-label="Lagu sebelumnya">⏮</button>
      <button id="bPlay" class="main" title="Putar / jeda" aria-label="Putar atau jeda">▶</button>
      <button id="bNext" title="Lagu berikutnya" aria-label="Lagu berikutnya">⏭</button>
    </div>
  </div>
</div>
<div id="toast" role="status"></div>
<dialog id="dlg"></dialog>
<input id="file" type="file" accept="audio/*" multiple hidden>
<audio id="au" preload="auto"></audio>

<script>
const $=s=>document.querySelector(s), au=$('#au');
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
const PEN='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';

/* ---------- penyimpanan (IndexedDB) ---------- */
let db, songs=[], lists=[];
const openDB=()=>new Promise((ok,no)=>{const r=indexedDB.open('lagu-lokal',1);
  r.onupgradeneeded=()=>{r.result.createObjectStore('songs',{keyPath:'id'});r.result.createObjectStore('lists',{keyPath:'id'})};
  r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const tx=(s,m,f)=>new Promise((ok,no)=>{const t=db.transaction(s,m);const q=f(t.objectStore(s));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>no(t.error)});
const loadAll=async()=>{songs=(await tx('songs','readonly',s=>s.getAll())).sort((a,b)=>a.added-b.added);lists=await tx('lists','readonly',s=>s.getAll())};
const saveList=l=>tx('lists','readwrite',s=>s.put(l));

/* ---------- tambah lagu ---------- */
const MIME={mp3:'audio/mpeg',m4a:'audio/mp4',aac:'audio/aac',wav:'audio/wav',ogg:'audio/ogg',opus:'audio/ogg',flac:'audio/flac',weba:'audio/webm'};
const mimeOf=(t,n)=>t&&t.startsWith('audio/')?t:(MIME[(n.split('.').pop()||'').toLowerCase()]||'audio/mpeg');
async function addSong(blob,name,fname){
  const buf=await blob.arrayBuffer();
  await tx('songs','readwrite',s=>s.put({id:uid(),name,buf,type:mimeOf(blob.type,fname||name),added:Date.now()}));
}
function blobOf(s){
  const b=s.buf?new Blob([s.buf],{type:s.type}):s.blob;
  return b.type&&b.type.startsWith('audio/')?b:b.slice(0,b.size,'audio/mpeg');
}
async function addFiles(files){
  let n=0;
  for(const f of files){ if(f.type.startsWith('audio/')||/\.(mp3|m4a|wav|ogg|flac|aac|opus)$/i.test(f.name)){await addSong(f,f.name.replace(/\.[^.]+$/,''),f.name);n++} }
  await loadAll();render();say(n?n+' lagu masuk ke pustaka.':'Tidak ada file audio yang dipilih.');
}
let toastT;
function say(t){const m=$('#toast');m.textContent=t;m.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>m.classList.remove('show'),2600)}

/* ---------- pemutar ---------- */
let queue=[],qi=-1,rep=false,objUrl=null;
const cur=()=>songs.find(s=>s.id===queue[qi]);
function playQueue(ids,i){queue=ids;qi=i;load()}
function load(){
  const s=cur(); if(!s) return;
  if(objUrl) URL.revokeObjectURL(objUrl);
  objUrl=URL.createObjectURL(blobOf(s)); au.src=objUrl;
  $('#now').textContent=s.name;
  au.play().catch(err=>{ if(err.name!=='AbortError') $('#now').textContent='Gagal memutar: '+s.name+' ('+err.name+')' });
  if('mediaSession' in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:s.name,artist:'Lagu Lokal'})}
  render();
}
function next(){
  if(!queue.length) return;
  qi=qi<queue.length-1?qi+1:0;   /* setelah lagu terakhir, kembali ke lagu pertama */
  load();
}
function prev(){
  if(!queue.length) return;
  if(au.currentTime>3){au.currentTime=0;return}
  qi=qi>0?qi-1:queue.length-1; load();
}
function toggle(){ if(!au.src) return; au.paused?au.play():au.pause() }
function setLoop(){
  rep=!rep; au.loop=rep;
  const b=$('#bLoop'); b.classList.toggle('on',rep);
  b.textContent=rep?'⟲1':'⟲';
  b.title='Ulangi satu lagu: '+(rep?'aktif':'mati');
}
au.onended=()=>{ if(!rep) next() };
au.onerror=()=>{ const s=cur(); $('#now').textContent='Format audio tidak didukung browser ini: '+(s?s.name:'') };
au.onplay=au.onpause=()=>{$('#bPlay').textContent=au.paused?'▶':'⏸'};
let seeking=false;
au.ontimeupdate=()=>{ $('#cur').textContent=fmt(au.currentTime); $('#dur').textContent=fmt(au.duration);
  if(!seeking) $('#sk').value=au.duration?au.currentTime/au.duration*100:0 };
$('#sk').oninput=e=>{seeking=true;if(au.duration)au.currentTime=e.target.value/100*au.duration};
$('#sk').onchange=()=>seeking=false;
$('#bPlay').onclick=toggle;$('#bNext').onclick=next;$('#bPrev').onclick=prev;$('#bLoop').onclick=setLoop;
if('mediaSession' in navigator){
  navigator.mediaSession.setActionHandler('previoustrack',prev);
  navigator.mediaSession.setActionHandler('nexttrack',next);
  navigator.mediaSession.setActionHandler('play',toggle);
  navigator.mediaSession.setActionHandler('pause',toggle);
}

/* ---------- tampilan ---------- */
let tab='lib', openList=null;
$('#tLib').onclick=()=>{tab='lib';openList=null;render()};
$('#tPl').onclick=()=>{tab='pl';openList=null;render()};
$('#add').onclick=()=>$('#file').click();

function songRow(s,ids,i,extra,swipe){
  const r=`<div class="row${swipe?' slide':''}${s.id===queue[qi]?' cur':''}">
    <button class="t" data-a="play" data-ids="${ids.join(',')}" data-i="${i}">${esc(s.name)}</button>
    <button class="i" data-a="addpl" data-id="${s.id}" title="Tambah ke playlist" aria-label="Tambah ke playlist">＋</button>${extra}</div>`;
  return swipe?`<div class="swrap"><button class="edit" data-a="edit" data-id="${s.id}" title="Ubah nama" aria-label="Ubah nama lagu">${PEN}</button>${r}</div>`:r;
}
function render(){
  $('#tLib').classList.toggle('on',tab==='lib');$('#tPl').classList.toggle('on',tab==='pl');
  const v=$('#view'); const all=songs.map(s=>s.id);
  if(tab==='lib'){
    v.innerHTML=`<h2>Pustaka (${songs.length})</h2>`+
      (songs.length?songs.map((s,i)=>songRow(s,all,i,`<button class="i" data-a="del" data-id="${s.id}" title="Hapus" aria-label="Hapus lagu">✕</button>`,true)).join(''):'<div class="empty">Pustaka masih kosong. Tekan tombol + di kanan atas untuk menambah lagu.</div>');
  }else if(!openList){
    v.innerHTML=`<div class="card"><div class="bar"><input id="nm" type="text" placeholder="Nama playlist baru"><button class="pri" id="mk">Buat</button></div></div>`+
      (lists.length?lists.map(l=>`<button class="pl" data-a="open" data-id="${l.id}"><span>${esc(l.name)}</span><span style="color:var(--mu)">${l.ids.length} lagu</span></button>`).join(''):'<div class="empty">Belum ada playlist.</div>');
    $('#mk').onclick=async()=>{const n=$('#nm').value.trim();if(!n)return;await saveList({id:uid(),name:n,ids:[]});await loadAll();render()};
  }else{
    const l=lists.find(x=>x.id===openList); if(!l){openList=null;return render()}
    const ids=l.ids.filter(id=>songs.some(s=>s.id===id));
    v.innerHTML=`<div class="bar" style="margin:10px 0"><button id="back">← Kembali</button><button class="pri" id="pall">Putar playlist</button><button id="dpl">Hapus playlist</button></div>
      <h2>${esc(l.name)} (${ids.length})</h2>`+
      (ids.length?ids.map((id,i)=>songRow(songs.find(s=>s.id===id),ids,i,`<button class="i" data-a="rm" data-id="${id}" title="Keluarkan dari playlist" aria-label="Keluarkan dari playlist">✕</button>`,false)).join(''):'<div class="empty">Playlist kosong. Buka Pustaka lalu tekan ＋ pada lagu.</div>');
    $('#back').onclick=()=>{openList=null;render()};
    $('#pall').onclick=()=>ids.length&&playQueue(ids,0);
    $('#dpl').onclick=async()=>{if(confirm('Hapus playlist ini?')){await tx('lists','readwrite',s=>s.delete(l.id));openList=null;await loadAll();render()}};
  }
}

/* ---------- geser lagu ke kanan untuk edit nama ---------- */
const MAXW=72; let sw=null, swiped=false;
function setRow(w,open){
  const s=w.querySelector('.slide'); w.classList.toggle('open',open);
  s.style.transition='transform .2s'; s.style.transform=open?`translateX(${MAXW}px)`:'';
}
const view=$('#view');
view.addEventListener('pointerdown',e=>{
  const w=e.target.closest('.swrap'); if(!w) return;
  sw={w,s:w.querySelector('.slide'),x:e.clientX,y:e.clientY,base:w.classList.contains('open')?MAXW:0,off:0,lock:false};
});
view.addEventListener('pointermove',e=>{
  if(!sw) return;
  const dx=e.clientX-sw.x, dy=e.clientY-sw.y;
  if(!sw.lock){
    if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)){
      sw.lock=true; swiped=true;
      document.querySelectorAll('.swrap.open').forEach(x=>x!==sw.w&&setRow(x,false));
      try{sw.s.setPointerCapture(e.pointerId)}catch(_){}
    }else return;
  }
  sw.off=Math.max(0,Math.min(MAXW,sw.base+dx));
  sw.s.style.transition='none'; sw.s.style.transform=`translateX(${sw.off}px)`;
});
const endSwipe=()=>{
  if(!sw) return;
  if(sw.lock) setRow(sw.w,sw.off>MAXW/2);
  sw=null; setTimeout(()=>swiped=false,80);
};
view.addEventListener('pointerup',endSwipe);
view.addEventListener('pointercancel',endSwipe);

view.addEventListener('click',async e=>{
  if(swiped) return;
  const b=e.target.closest('[data-a]'); if(!b) return; const a=b.dataset.a, id=b.dataset.id;
  if(a==='play') playQueue(b.dataset.ids.split(','),+b.dataset.i);
  if(a==='open'){openList=id;render()}
  if(a==='del'&&confirm('Hapus lagu ini dari pustaka?')){
    await tx('songs','readwrite',s=>s.delete(id));
    for(const l of lists){if(l.ids.includes(id)){l.ids=l.ids.filter(x=>x!==id);await saveList(l)}}
    await loadAll();render();
  }
  if(a==='rm'){const l=lists.find(x=>x.id===openList);l.ids=l.ids.filter(x=>x!==id);await saveList(l);render()}
  if(a==='edit'){
    const s=songs.find(x=>x.id===id), d=$('#dlg');
    d.innerHTML=`<strong>Ubah nama lagu</strong><input id="rn" type="text" value="${esc(s.name)}" maxlength="120" aria-label="Nama lagu"><div class="two"><button data-x="no">Batal</button><button class="pri" data-x="ok">Simpan</button></div>`;
    d.onclick=async ev=>{
      const x=ev.target.closest('button'); if(!x) return;
      if(x.dataset.x==='ok'){
        const n=$('#rn').value.trim();
        if(n){s.name=n;await tx('songs','readwrite',q=>q.put(s));if(queue[qi]===id)$('#now').textContent=n}
      }
      d.close();render();
    };
    d.showModal();
    const rn=$('#rn'); rn.focus(); rn.select();
    rn.onkeydown=ev=>{if(ev.key==='Enter')d.querySelector('[data-x=ok]').click()};
  }
  if(a==='addpl'){
    const d=$('#dlg');
    d.innerHTML=`<strong>Tambah ke playlist</strong>`+(lists.length?lists.map(l=>`<button data-l="${l.id}">${esc(l.name)}</button>`).join(''):'<p style="color:var(--mu);margin-top:8px">Buat playlist dulu di tab Playlist.</p>')+`<button data-l="">Tutup</button>`;
    d.onclick=async ev=>{const x=ev.target.closest('button');if(!x)return;
      if(x.dataset.l){const l=lists.find(q=>q.id===x.dataset.l);if(!l.ids.includes(id)){l.ids.push(id);await saveList(l)}}
      d.close()};
    d.showModal();
  }
});
$('#file').onchange=e=>{addFiles([...e.target.files]);e.target.value=''};
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();addFiles([...e.dataTransfer.files])});

if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{})}
openDB().then(async d=>{db=d;await loadAll();render()}).catch(()=>{$('#view').innerHTML='<div class="empty">Browser tidak mengizinkan penyimpanan lokal. Coba buka di Chrome atau Firefox biasa (bukan mode privat).</div>'});
</script>
</body>
</html>
